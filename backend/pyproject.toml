[project]
name = "grove-backend"
version = "0.1.0"
description = "Grove — server-authoritative aptitude and reasoning practice backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-pptx>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
grove-ingest = "ingestion.cli:main"
grove-serve = "app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
